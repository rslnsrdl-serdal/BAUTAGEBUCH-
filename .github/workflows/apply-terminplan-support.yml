name: Apply Terminplan backup support
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-terminplan-support.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generic Terminplan backup reader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          anchor = "function termRangeLabel(a,b){const A=termCodeToYW(a),B=termCodeToYW(b);return A.week===B.week?'KW'+String(A.week).padStart(2,'0'):'KW'+String(A.week).padStart(2,'0')+'–'+String(B.week).padStart(2,'0')}\n"
          helper = """function termBuildWeeks(groups){
           const values=groups.flatMap(g=>Array.isArray(g.tasks)?g.tasks.flatMap(t=>[Number(t[1]),Number(t[2])]):[]).filter(Number.isFinite);
           if(!values.length){const cur=termCurrentYW(),arr=[];let y=cur.year,w=cur.week;for(let i=0;i<16;i++){arr.push({year:y,week:w});if(++w>52){w=1;y++}}return arr}
           const points=values.map(termCodeToYW).sort((a,b)=>(a.year*53+a.week)-(b.year*53+b.week)),first=points[0],last=points[points.length-1],arr=[];let y=first.year,w=first.week;
           while(arr.length<60){arr.push({year:y,week:w});if(y===last.year&&w===last.week)break;if(++w>52){w=1;y++}}
           return arr;
          }
          """
          if "function termBuildWeeks(groups)" not in text:
              if anchor not in text:
                  raise SystemExit("Terminplan helper anchor not found")
              text = text.replace(anchor, anchor + helper, 1)
          old = " const grid=document.getElementById('termGrid');if(!grid)return;const cur=termCurrentYW();"
          new = " const grid=document.getElementById('termGrid');if(!grid)return;const cur=termCurrentYW(),termData=Array.isArray(S&&S.terminplan)?S.terminplan:TERM_DATA;TERM_WEEKS.splice(0,TERM_WEEKS.length,...termBuildWeeks(termData));"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Terminplan render anchor not found")
          old_groups = " const groups=TERM_DATA.filter(g=>filter==='all'||g.id===filter);"
          new_groups = " const groups=termData.filter(g=>filter==='all'||g.id===filter);"
          if old_groups in text:
              text = text.replace(old_groups, new_groups, 1)
          elif new_groups not in text:
              raise SystemExit("Terminplan data anchor not found")
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/apply-terminplan-support.yml").unlink()
          PY
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add index.html .github/workflows/apply-terminplan-support.yml
          git commit -m "Backup Terminplan verisini destekle"
          git push
